# =============================================================================
# AI2-THOR A/B probe : WITH world-model hints (memory_probe enabled)
# Everything else is byte-identical to config_qwen_maas_base.yaml so that the
# only difference between the two arms is the injected hint.
# =============================================================================

env:
  type: ai2thor
  agent_count: 1
  width: 800
  height: 600
  field_of_view: 60
  grid_size: 0.25
  render_depth: false
  render_instance_segmentation: false
  text_state_mode: first_person
  visibility_distance: 1.0
  platform: null

max_steps: 40

context_management:
  enable_long_term_summary: false
  short_term_history_window_size: 29

model:
  vlm:
    provider: openai
    model_name: qwen3-vl-plus
    temperature: 1.0
    max_tokens: 1024
    base_url: "https://ws-8cx5o2lzlaxfaqlc.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
    api_key: "sk-ws-H.EDILERI.15cE.MEUCIQDSPCTScWRxIjeg0vNqP7GeQPG_IaVAL-tEKYAHvUUeKQIgJGyyotPLyEMFfPaRMqVwrhP8Nm9lBiWnewNnDaKJv1k"

logging:
  stdout_verbose: true
  save_step_images: false

actions:
  move_small_magnitude: 0.25
  move_medium_magnitude: 0.5
  move_large_magnitude: 1
  move_ahead_magnitude: 0.5
  move_back_magnitude: 0.5
  move_left_magnitude: 0.5
  move_right_magnitude: 0.5
  rotate_degrees: 90

reward:
  success_reward: 10.0
  step_success_bonus: 0.1
  step_failure_penalty: -0.05

experiment:
  num_episodes: 1
  output_dir: outputs_ab_hint

task_presets:
  open_fridge:
    scene: FloorPlan1
    description: Find the fridge in the kitchen, walk to the front of it, and then open the fridge door.
    target_object_types: [Fridge]
    success_condition: {type: object_state, field: isOpen, value: true, any: true}
    target_description: Find and open any Fridge
    max_steps: 40
  open_microwave:
    scene: FloorPlan1
    description: Find the microwave in the kitchen, walk to the front of it, and then open the microwave door.
    target_object_types: [Microwave]
    success_condition: {type: object_state, field: isOpen, value: true, any: true}
    target_description: Find and open any Microwave
    max_steps: 40
  pickup_egg:
    scene: FloorPlan2
    description: Find the egg (Egg), approach it, and then pick up the egg.
    target_object_types: [Egg]
    success_condition: {type: object_in_hand, object_type: Egg}
    target_description: Find and pick up the egg (Egg)
    max_steps: 40
  put_egg_in_pan:
    scene: FloorPlan2
    description: Find the egg (Egg), pick it up, and then put it into the pan (Pan)
    target_object_types: [Egg, Pan]
    success_condition: {type: object_state, field: parentReceptacles, value: Pan, any: true}
    target_description: Find the egg and put it into the pan
    max_steps: 60

memory_probe:
  enabled: true
  oracle_reachable: false
  use_success_conditions: true
